<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <h1>🌐 Language Translator</h1>
      <p>Translate text quickly and easily</p>
    </header>

    <main class="translator-box">

      <div class="language-row">

        <div class="language-group">
          <label>From</label>
          <select id="sourceLanguage">
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

        <button class="swap-btn" onclick="swapLanguages()">⇄</button>

        <div class="language-group">
          <label>To</label>
          <select id="targetLanguage">
            <option value="fr">French</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

      </div>

      <div class="text-area">
        <textarea id="text" placeholder="Enter text to translate..."></textarea>
        <button class="clear-btn" onclick="clearText()">Clear</button>
      </div>

      <button class="translate-btn" onclick="translateText()">
        Translate
      </button>

      <div class="result-box">
        <h3>Translation</h3>
        <div id="result">Translation will appear here...</div>

        <div class="result-actions">
          <button onclick="copyText()">📋 Copy</button>
          <button onclick="speakText()">🔊 Listen</button>
        </div>
      </div>

    </main>

    <button class="theme-btn" onclick="toggleTheme()">
      🌙 Dark Mode
    </button>

    <footer>
      <p>© 2026 Language Translation Tool</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
