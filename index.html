<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Language Translation Tool</h1>

        <textarea id="text" placeholder="Enter text to translate..."></textarea>

        <div class="language-selection">
            <select id="sourceLanguage">
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ar">Arabic</option>
            </select>

            <select id="targetLanguage">
                <option value="fr">French</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="ar">Arabic</option>
            </select>
        </div>

        <button onclick="translateText()">Translate</button>

        <div id="result">Translation will appear here...</div>

        <button onclick="copyText()">Copy Translation</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
